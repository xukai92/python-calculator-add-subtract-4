[project]
name = "calculator"
version = "0.1.0"
description = "A production-quality Python calculator with add, subtract, multiply, and divide operations"
readme = "README.md"
authors = [
    { name = "Kai Xu", email = "xuk@redhat.com" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.scripts]
calculator = "calculator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["calculator"]

[tool.coverage.report]
show_missing = true
